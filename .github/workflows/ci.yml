name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
          POSTGRES_DB: einat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d einat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_ISSUER: ci-einat-api
      JWT_AUDIENCE: ci-einat-admin
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=server -- prisma generate
      - run: npm exec --workspace=server -- prisma validate
      - run: npm exec --workspace=server -- prisma migrate deploy
      - run: npm exec --workspace=server -- prisma db seed
      - run: npm run build
      - run: npm run test:unit --workspace=server
      - run: npm run test:integration --workspace=server
      - run: npm audit --omit=dev --audit-level=high
      - name: Smoke test API startup
        run: npm run start &
      - name: Wait for API health endpoint
        uses: ./.github/actions/wait-for-url
        with:
          url: http://localhost:3000/api/health

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
          POSTGRES_DB: einat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d einat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_ISSUER: ci-einat-api
      JWT_AUDIENCE: ci-einat-admin
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=server -- prisma generate
      - run: npm exec --workspace=server -- prisma migrate deploy
      - run: npm exec --workspace=server -- prisma db seed
      - run: npm run build
      - name: Start backend
        run: npm run start &
      - uses: actions/checkout@v4
        with:
          repository: OlgaPechisker/meditationapp-client
          ref: main
          path: client-e2e
      - name: Install client dependencies
        working-directory: client-e2e
        run: npm ci
      - name: Build client SSR application
        working-directory: client-e2e
        run: npm run build
      - name: Start client SSR server
        working-directory: client-e2e
        run: PORT=4000 npm run serve:ssr:client &
      - name: Wait for API health endpoint
        uses: ./.github/actions/wait-for-url
        with:
          url: http://localhost:3000/api/health
      - name: Wait for client SSR application
        uses: ./.github/actions/wait-for-url
        with:
          url: http://localhost:4000/
      - run: npm run e2e:install
      - name: Run end-to-end tests
        run: npm run e2e
        env:
          APP_URL: http://localhost:4000
          API_URL: http://localhost:3000
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
