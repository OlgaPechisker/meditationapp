name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
          POSTGRES_DB: einat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d einat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
      JWT_SECRET: ci-jwt-secret-not-for-production
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=server -- prisma validate
      - run: npm exec --workspace=server -- prisma migrate deploy
      - run: npm exec --workspace=server -- prisma db seed
      - run: npm run build
      - run: npm run test --workspace=server
      - run: npm audit --omit=dev --audit-level=high
      - name: Smoke test API startup
        run: |
          npm run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
